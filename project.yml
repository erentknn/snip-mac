# Xcode project for the Mac App Store build. Run `xcodegen`, open Snip.xcodeproj, then
# Product → Archive and Distribute App → App Store Connect. Everyday builds and the DMG
# release use SwiftPM (build.sh, release.sh) and don't need it.
name: Snip
options:
  bundleIdPrefix: dev.eren
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: BMYT84FGKT
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Snip:
    type: application
    platform: macOS
    sources:
      - Sources/Snip
      - Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eren.snip
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Snip.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
